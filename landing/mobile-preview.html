<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GEMS | Xem trước mobile</title>
  <style>
    :root { --ink:#0b2d40; --paper:#f4f1e9; --line:rgba(11,45,64,.15); }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; padding:34px 20px; background:radial-gradient(circle at 50% 0,#dceceb,transparent 36%),var(--paper); color:var(--ink); font-family:"Be Vietnam Pro",system-ui,sans-serif; }
    header { display:flex; max-width:430px; align-items:baseline; justify-content:space-between; margin:0 auto 18px; }
    h1 { margin:0; font-size:14px; letter-spacing:-.02em; }
    p { margin:0; color:#60737c; font-size:11px; }
    .viewport { width:min(100%,390px); height:844px; margin:0 auto; overflow:hidden; border:1px solid var(--line); border-radius:24px; background:#fff; box-shadow:0 25px 60px rgba(11,45,64,.17); }
    iframe { display:block; width:100%; height:100%; border:0; }
    @media (max-width:450px) { body { padding:0; } header { display:none; } .viewport { width:100%; height:100svh; border:0; border-radius:0; box-shadow:none; } }
  </style>
</head>
<body>
  <header><h1>GEMS · Phiên bản mobile</h1><p>390 × 844</p></header>
  <div class="viewport"><iframe src="./?mobile-preview=1" title="GEMS phiên bản mobile"></iframe></div>
</body>
</html>
